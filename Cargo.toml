[package]
name = "sunbeam"
version = "3.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunbeamdotpt/cli"
description = "Sunbeam Compute Platform CLI"

[[bin]]
name = "sunbeam"
path = "src/main.rs"

[build-dependencies]
chrono = "0.4"

[dev-dependencies]
wiremock = "0.6"
sdk = { git = "https://github.com/sunbeamdotpt/sdk", tag = "v3.1.1", default-features = false, features = ["kanban", "wfectl", "kube", "openbao", "secrets", "vault-keystore", "vpn", "testing", "auth"] }
testcontainers = "0.27.3"
http = "1"
tower-test = "0.4"

[dependencies]
sdk = { git = "https://github.com/sunbeamdotpt/sdk", tag = "v3.1.1", default-features = false, features = ["kanban", "wfectl", "kube", "openbao", "secrets", "vault-keystore", "vpn", "lettre", "auth"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
comfy-table = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
chrono = { version = "0.4", features = ["serde"] }
wfe = "1.10.0"
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-sqlite = "1.10.0"
wfe-yaml = { version = "1.10.0", features = ["rustlang", "buildkit", "containerd", "kubernetes"] }
wfe-server-protos = "1.10.0"
tempfile = "3"
anyhow = "1"
thiserror = "1"
hmac = "0.12"
sha2 = "0.10"
rsa = "0.9"
rcgen = "0.13"
dirs = "6"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
rand = "0.8"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
prost-types = "0.14"
jiff = "0.2"
libc = "0.2.184"
ulid = "1"
