[package]
name = "sunbeam"
version = "2.0.0-rc5"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunbeamdotpt/cli"
description = "Sunbeam Studios CLI"

[[bin]]
name = "sunbeam"
path = "src/main.rs"

[dependencies]
sunbeam-sdk = { path = "sunbeam-sdk", version = "2.0.0-rc5" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
chrono = { version = "0.4", features = ["serde"] }
kube = { version = "3.1", features = ["runtime", "client", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
wfe = "1.10.0"
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-sqlite = "1.10.0"
wfe-yaml = { version = "1.10.0", features = ["rustlang", "buildkit", "containerd", "kubernetes"] }
wfe-server-protos = "1.10.0"
tempfile = "3"
repo-rs-cmd = "0.2.3"
repo-rs-engine = "0.2.3"
repo-rs-model = "0.2.3"
repo-rs-git = "0.2.3"
repo-rs-manifest = "0.2.3"
camino = "1.2"
indexmap = "2.14"
anstream = "1"
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
rand = "0.8"
flate2 = "1"
tar = "0.4"
bytes = "1.0"
h2 = "0.4"
http = "1"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }
vaultrs = "0.8"
tonic = { version = "0.14", features = ["tls-native-roots"] }
prost-types = "0.14"
prost = "0.14"
gix = { version = "0.81.0", default-features = false, features = ["sha1", "revision"] }
ipnet = "2"
zstd = "0.13"
jiff = "0.2"
hostname = "0.4.2"
whoami = "2.1.1"
libc = "0.2.184"
ulid = "1"
indicatif = { version = "0.17", features = ["tokio"] }
