[package]
name = "sunbeam"
version = "1.1.2"
edition = "2024"
description = "Sunbeam Studios CLI"
repository = "https://src.sunbeam.pt/studio/cli"
license = "MIT"

[[bin]]
name = "sunbeam"
path = "src/main.rs"

[workspace]
members = ["sunbeam-sdk", "sunbeam-net"]
resolver = "3"

[dependencies]
# Workspace
sunbeam-sdk = { path = "sunbeam-sdk" }
sunbeam-net = { path = "sunbeam-net" }

# Core
thiserror = "2"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = { version = "0.23", features = ["ring"] }

# Kubernetes
kube = { version = "0.99", features = ["client", "runtime", "derive", "ws"] }
k8s-openapi = { version = "0.24", features = ["v1_32"] }

# HTTP + TLS
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
bytes = "1"

# SSH
russh = "0.46"
russh-keys = "0.46"

# Crypto
rsa = "0.9"
pkcs8 = { version = "0.10", features = ["pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
indicatif = { version = "0.17", features = ["tokio"] }

# Certificate generation
rcgen = "0.14"

# SMTP
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# Archive handling
flate2 = "1"
tar = "0.4"

# Async
futures = "0.3"
tokio-stream = "0.1"

# Utility
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }

# OpenBao/Vault client
vaultrs = "0.8"

# Workflow engine
wfe = { version = "1.9.0", registry = "sunbeam" }
wfe-core = { version = "1.9.0", registry = "sunbeam", features = ["test-support"] }
wfe-sqlite = { version = "1.9.0", registry = "sunbeam" }
wfe-yaml = { version = "1.9.0", registry = "sunbeam", features = ["rustlang", "buildkit", "containerd", "kubernetes"] }

# WFE remote (gRPC client for wfe-server)
wfe-server-protos = { version = "1.9.0", registry = "sunbeam" }
tonic = { version = "0.14", features = ["tls-native-roots"] }
prost-types = "0.14"
prost = "0.14"
comfy-table = "7"
anyhow = "1"
async-trait = "0.1"
hostname = "0.4.2"
whoami = "2.1.1"
libc = "0.2.184"

[dev-dependencies]
wiremock = "0.6"

[build-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
chrono = "0.4"
