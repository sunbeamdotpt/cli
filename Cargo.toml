[workspace]
members = ["sunbeam-sdk"]
resolver = "3"

[workspace.package]
version = "2.0.0-rc5"
edition = "2024"
license = "MIT"
repository = "https://github.com/sunbeamdotpt/cli"
authors = ["Sunbeam Studios"]

[workspace.dependencies]
sunbeam-sdk = { path = "sunbeam-sdk", version = "2.0.0-rc5" }

# Async runtime / tracing
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26.4"
tokio-test = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures = "0.3"
async-trait = "0.1"

# TLS / rustls
rustls = { version = "0.23", features = ["aws-lc-rs"] }
webpki-roots = "1.0.6"
rustls-pemfile = "2.2.0"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Errors
thiserror = "2.0"
anyhow = "1.0"

# Kubernetes
kube = { version = "3.1", features = ["runtime", "client", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
bytes = "1.0"
h2 = "0.4"
http = "1"

# Crypto
rsa = "0.9"
pkcs8 = { version = "0.10", features = ["pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
sha2 = "0.10"
hmac = "0.12"
blake2 = "0.10"
chacha20poly1305 = "0.10"
hkdf = "0.12"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
crypto_box = "0.9"
subtle = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rcgen = "0.14"

# Networking / VPN
boringtun = "0.7"
smoltcp = { version = "0.13", default-features = false, features = ["medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "std"] }
ipnet = "2"
zstd = "0.13"

# SMTP
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4"
comfy-table = "7"
indicatif = { version = "0.17", features = ["tokio"] }

# Archive handling
flate2 = "1"
tar = "0.4"

# Utility
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
jiff = "0.2"
hostname = "0.4.2"
whoami = "2.1.1"
libc = "0.2.184"

# OpenBao / Vault
vaultrs = "0.8"

# gRPC
tonic = { version = "0.14", features = ["tls-native-roots"] }
prost-types = "0.14"
prost = "0.14"

# VCS
gix = { version = "0.81.0", default-features = false, features = ["sha1", "revision"] }

# repo-rs
camino = "1.2"
indexmap = "2.14"

# Dev
wiremock = "0.6"
pretty_assertions = "1"

# Workflow engine
wfe = "1.10.0"
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-sqlite = "1.10.0"
wfe-yaml = { version = "1.10.0", features = ["rustlang", "buildkit", "containerd", "kubernetes"] }
wfe-server-protos = "1.10.0"

[package]
name = "sunbeam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Sunbeam Studios CLI"

[[bin]]
name = "sunbeam"
path = "src/main.rs"

[dependencies]
sunbeam-sdk = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
rustls.workspace = true
