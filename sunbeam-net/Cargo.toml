[package]
name = "sunbeam-net"
version = "2.0.0-rc5"
edition = "2024"
license = "MIT"
repository = "https://src.sunbeam.pt/studio/cli"
description = "Pure Rust Headscale/Tailscale-compatible VPN client"


[dependencies]
# Async / tracing
tokio.workspace = true
tokio-util.workspace = true
tokio-rustls.workspace = true
futures.workspace = true
tracing.workspace = true

# Serde
serde.workspace = true
serde_json.workspace = true

# Errors
thiserror.workspace = true

# HTTP / TLS
h2.workspace = true
http.workspace = true
webpki-roots.workspace = true
rustls-pemfile.workspace = true

# Crypto
blake2.workspace = true
chacha20poly1305.workspace = true
hkdf.workspace = true
hmac.workspace = true
x25519-dalek.workspace = true
crypto_box.workspace = true
rand.workspace = true
subtle.workspace = true
base64.workspace = true

# Networking / VPN
boringtun.workspace = true
smoltcp.workspace = true
ipnet.workspace = true
zstd.workspace = true
bytes.workspace = true
libc.workspace = true

[features]
integration = []

# Linux-only: rtnetlink-based network interface monitor.
# rtnetlink re-exports netlink-packet-{core,route} so we use those re-exports
# to avoid pulling in a second copy at a different version.
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = "0.20"

[dev-dependencies]
tokio-test.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
