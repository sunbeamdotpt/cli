[package]
name = "sunbeam-sdk"
version = "2.0.0-rc4"
edition = "2024"
license = "MIT"
repository = "https://src.sunbeam.pt/studio/cli"
description = "Sunbeam Studios SDK, CLI, and ecosystem integrations"
publish = ["sunbeam"]

[dependencies]
# Internal
sunbeam-net.workspace = true

# Core
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true

# CLI
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
indicatif.workspace = true

# Serde
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Kubernetes
kube.workspace = true
k8s-openapi.workspace = true

# HTTP / TLS
reqwest.workspace = true
bytes.workspace = true

# Crypto
rsa.workspace = true
pkcs8.workspace = true
pkcs1.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
rcgen.workspace = true

# SMTP
lettre.workspace = true

# Archive handling
flate2.workspace = true
tar.workspace = true

# Utility
tempfile.workspace = true
dirs.workspace = true
chrono.workspace = true
jiff = "0.2"
hostname.workspace = true
whoami.workspace = true
libc.workspace = true

# OpenBao / Vault
vaultrs.workspace = true

# Workflow engine
wfe.workspace = true
wfe-core.workspace = true
wfe-sqlite.workspace = true
wfe-yaml.workspace = true
wfe-server-protos.workspace = true
connectrpc = { version = "0.3.3", features = ["client", "client-tls"] }
buffa = { version = "0.3" }
webpki-roots = { workspace = true }

# tonic: used by wfectl (wfe-server-protos is tonic-based)
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }

# http: used by grpc_auth (connectrpc client config)
http = { workspace = true }

# gitserv gRPC client (dual-address: local path + Gitea registry for publish)
gitserv-proto = { path = "../../../libs/gitserv/crates/gitserv-proto", version = "2.0", registry = "sunbeam" }

[dev-dependencies]
wiremock.workspace = true

[build-dependencies]
reqwest = { workspace = true }
sha2.workspace = true
flate2.workspace = true
tar.workspace = true
chrono.workspace = true
