[package]
name = "sunbeam-sdk"
version = "2.0.0-rc5"
edition = "2024"
license = "MIT"
repository = "https://src.sunbeam.pt/studio/cli"
description = "Sunbeam Studios SDK, CLI, and ecosystem integrations"

[dependencies]
# Internal
sunbeam-net = { git = "https://github.com/sunbeamdotpt/vpn" }

# Core
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
async-trait = "0.1"
futures = "0.3"

# CLI (kept for action/args derives used by SDK internals)
clap = { version = "4.5", features = ["derive"] }
comfy-table = "7"
indicatif = { version = "0.17", features = ["tokio"] }

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Kubernetes
kube = { version = "3.1", features = ["runtime", "client", "ws"] }
k8s-openapi = { version = "0.27", features = ["latest"] }

# HTTP / TLS
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
bytes = "1.0"

# Crypto
rsa = "0.9"
pkcs8 = "0.10"
pkcs1 = "0.7"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
rcgen = "0.13"

# SMTP
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname"] }

# Archive handling
flate2 = "1"
tar = "0.4"

# Utility
tempfile = "3"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
jiff = "0.2"
hostname = "0.4.2"
whoami = "2.1.1"
libc = "0.2.184"

# VCS
gix = { version = "0.81.0", default-features = false, features = ["revision", "sha1"] }
repo-rs-cmd = "0.2.3"
repo-rs-engine = "0.2.3"
repo-rs-model = "0.2.3"
repo-rs-git = "0.2.3"
repo-rs-manifest = "0.2.3"
camino = "1.2"
indexmap = "2.14"

# OpenBao / Vault
vaultrs = "0.8"

# Workflow engine
wfe = "1.10.0"
wfe-core = { version = "1.10.0", features = ["test-support"] }
wfe-sqlite = "1.10.0"
wfe-yaml = { version = "1.10.0", features = ["rustlang", "buildkit", "containerd", "kubernetes"] }
wfe-server-protos = "1.10.0"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
prost-types = "0.14"
prost = "0.14"
ulid = "1"

[dev-dependencies]
wiremock = "0.6"
mockall = "0.13"
async-trait = "0.1"
rustls = { version = "0.23", features = ["aws-lc-rs"] }

[build-dependencies]
chrono = { version = "0.4", features = ["serde"] }
tonic-prost-build = "0.14"
