[package]
name = "sunbeam-sdk"
version = "2.0.0-rc5"
edition = "2024"
license = "MIT"
repository = "https://src.sunbeam.pt/studio/cli"
description = "Sunbeam Studios SDK, CLI, and ecosystem integrations"


[dependencies]
# Internal
sunbeam-net = { git = "https://github.com/sunbeamdotpt/vpn" }

# Core
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait.workspace = true
futures.workspace = true

# CLI
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
indicatif.workspace = true

# Serde
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Kubernetes
kube.workspace = true
k8s-openapi.workspace = true

# HTTP / TLS
reqwest.workspace = true
bytes.workspace = true

# Crypto
rsa.workspace = true
pkcs8.workspace = true
pkcs1.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
rand.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
rcgen.workspace = true

# SMTP
lettre.workspace = true

# Archive handling
flate2.workspace = true
tar.workspace = true

# Utility
tempfile.workspace = true
dirs.workspace = true
chrono.workspace = true
jiff = "0.2"
hostname.workspace = true
whoami.workspace = true
libc.workspace = true

# VCS
gix = { workspace = true, default-features = false, features = ["revision", "sha1"] }
repo-rs-cmd = "0.2.0"
repo-rs-engine = "0.2.0"
repo-rs-model = "0.2.0"
repo-rs-git = "0.2.0"
repo-rs-manifest = "0.2.0"
camino = { workspace = true }
indexmap = { workspace = true }
anstream = "1"

# OpenBao / Vault
vaultrs.workspace = true

# Workflow engine
wfe.workspace = true
wfe-core.workspace = true
wfe-sqlite.workspace = true
wfe-yaml.workspace = true
wfe-server-protos.workspace = true
tonic = { workspace = true, features = ["tls-native-roots"] }
prost-types.workspace = true
prost.workspace = true

[dev-dependencies]
wiremock.workspace = true

[build-dependencies]
chrono.workspace = true
