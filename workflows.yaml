# workflows.yaml -- sunbeam CLI CI pipeline
#
# Runs on every push via wfe-server webhook → ci workflow.
# Single bin crate `sunbeam` (v3). Platform client logic lives in the
# external `sdk` crate (git-tag dependency, github.com/sunbeamdotpt/sdk).
#
# PREREQUISITE: the sdk generates its ConnectRPC stubs at build time via
# `buf export buf.build/sunbeamdotpt/kanban` — every step that compiles
# (clippy, nextest) must install `buf` first (see &buf_install below) and
# needs network access to buf.build.
#
# Binary distribution is handled out-of-band via `dist/` tarballs —
# cross-compilation for darwin/linux isn't wired into this pipeline yet
# (no Dockerfile, no `cross` runner), so the image step is intentionally
# omitted. Revisit once we have a cross-build story.
#
# Integration tests under tests/ use testcontainers (via the sdk `testing`
# feature) and skip cleanly when Docker is unavailable — safe to run in CI
# either way.
#
# === Prerequisites ===
#
# 1. wfe-server deployed (see ../sbbb/base/wfe/)
# 2. wfe-credentials Secret with sccache-*, aws-*, cargo-registry-token,
#    gitea-token
# 3. wfe-ci image at src.sunbeam.pt/studio/wfe-ci:latest

# --- Shared Templates ---

_templates:

  ci_env: &ci_env
    SCCACHE_BUCKET: ${WFE_SCCACHE_BUCKET}
    SCCACHE_REGION: ${WFE_SCCACHE_REGION}
    SCCACHE_ENDPOINT: ${WFE_SCCACHE_S3_ENDPOINT}
    SCCACHE_S3_USE_SSL: "true"
    AWS_ACCESS_KEY_ID: ${WFE_AWS_ACCESS_KEY_ID}
    AWS_SECRET_ACCESS_KEY: ${WFE_AWS_SECRET_ACCESS_KEY}
    CARGO_HOME: /workspace/.cargo
    RUSTC_WRAPPER: /usr/local/cargo/bin/sccache
    CARGO_INCREMENTAL: "0"
    GITEA_TOKEN: ${WFE_GITEA_TOKEN}
    TEA_TOKEN: ${WFE_GITEA_TOKEN}
    CARGO_REGISTRIES_SUNBEAM_TOKEN: ${WFE_CARGO_REGISTRY_TOKEN}

  ci_config: &ci_config
    image: src.sunbeam.pt/studio/wfe-ci:latest
    memory: 4Gi
    cpu: "2"
    timeout: 30m
    env: *ci_env

  ci_long_config: &ci_long_config
    image: src.sunbeam.pt/studio/wfe-ci:latest
    memory: 8Gi
    cpu: "4"
    timeout: 60m
    env: *ci_env

  # NOTE: steps that compile must install `buf` first (sdk build.rs codegen).
  # YAML aliases don't expand inside `run: |` blocks, so these two lines are
  # inlined in each compiling step:
  #   curl -sSfL "https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-Linux-$(uname -m)" -o /usr/local/bin/buf
  #   chmod +x /usr/local/bin/buf

# --- Workflows ---

workflows:

  # === checkout ===

  - id: checkout
    name: Checkout
    version: 1
    inputs:
      repo_url: string
      commit_sha: string
    outputs:
      checkout_ok: bool
      commit: string
    steps:
      - name: clone
        type: kubernetes
        outputs:
          - name: checkout_ok
          - name: commit
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            cd /workspace
            if [ ! -d cli ]; then
              git clone "$REPO_URL" cli
            fi
            cd cli
            git fetch --all
            git checkout "$COMMIT_SHA"
            COMMIT=$(git rev-parse HEAD)
            echo "Checked out: $COMMIT"
            echo "##wfe[output checkout_ok=true]"
            echo "##wfe[output commit=$COMMIT]"

  # === lint: fmt + clippy ===

  - id: lint
    name: Lint
    version: 1
    outputs:
      fmt_ok: bool
      clippy_ok: bool
    steps:
      - name: fmt-check
        type: kubernetes
        outputs:
          - name: fmt_ok
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            cd /workspace/cli
            cargo fmt --all -- --check
            echo "##wfe[output fmt_ok=true]"

      - name: clippy
        type: kubernetes
        outputs:
          - name: clippy_ok
        config:
          <<: *ci_long_config
          run: |
            set -euo pipefail
            curl -sSfL "https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-Linux-$(uname -m)" -o /usr/local/bin/buf
            chmod +x /usr/local/bin/buf
            cd /workspace/cli
            cargo clippy --all-targets -- -D warnings
            echo "##wfe[output clippy_ok=true]"

  # === test-unit: bin-crate tests (integration suites skip without docker) ===

  - id: test-unit
    name: Unit Tests
    version: 1
    outputs:
      tests_ok: bool
    steps:
      - name: nextest
        type: kubernetes
        outputs:
          - name: tests_ok
        config:
          <<: *ci_long_config
          run: |
            set -euo pipefail
            curl -sSfL "https://github.com/bufbuild/buf/releases/download/v1.71.0/buf-Linux-$(uname -m)" -o /usr/local/bin/buf
            chmod +x /usr/local/bin/buf
            cd /workspace/cli
            cargo nextest run
            echo "##wfe[output tests_ok=true]"

  # === tag: read version from the top-level Cargo.toml ===

  - id: tag
    name: Tag Release
    version: 1
    outputs:
      version: string
      tag_created: bool
      tag_already_existed: bool
    steps:
      - name: read-version
        type: kubernetes
        outputs:
          - name: version
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            cd /workspace/cli
            VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            echo "Version: $VERSION"
            echo "##wfe[output version=$VERSION]"

      - name: check-tag-exists
        type: kubernetes
        outputs:
          - name: tag_already_existed
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            cd /workspace/cli
            git fetch --tags
            TAG="v${VERSION}"
            if git tag -l "$TAG" | grep -q "$TAG"; then
              echo "##wfe[output tag_already_existed=true]"
            else
              echo "##wfe[output tag_already_existed=false]"
            fi

      - name: create-tag
        type: kubernetes
        when:
          field: .outputs.tag_already_existed
          equals: false
        outputs:
          - name: tag_created
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            cd /workspace/cli
            TAG="v${VERSION}"
            git config user.email "wfe-ci@sunbeam.pt"
            git config user.name "wfe-ci"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
            echo "##wfe[output tag_created=true]"

  # === release: create Gitea release ===
  # (Nothing is published to a cargo registry from this repo anymore — the
  # sdk crate lives in its own repo. The tag + Gitea release are the
  # distribution record; binaries are attached out-of-band.)

  - id: release
    name: Gitea Release
    version: 1
    inputs:
      version: string
    outputs:
      release_created: bool
      release_url: string
    steps:
      - name: create-gitea-release
        type: kubernetes
        outputs:
          - name: release_created
          - name: release_url
        config:
          <<: *ci_config
          run: |
            set -euo pipefail
            TAG="v${VERSION}"
            tea login add --name sunbeam --url https://src.sunbeam.pt --token "$TEA_TOKEN" 2>/dev/null || true
            if tea release create \
              --repo studio/cli \
              --tag "$TAG" \
              --title "$TAG" \
              --note "sunbeam CLI ${VERSION}. Binaries are built out-of-band and attached manually." 2>&1; then
              echo "##wfe[output release_created=true]"
            else
              echo "##wfe[output release_created=false]"
            fi
            echo "##wfe[output release_url=https://src.sunbeam.pt/studio/cli/releases/tag/${TAG}]"

  # === ci: top-level orchestrator ===

  - id: ci
    name: Continuous Integration
    version: 1
    inputs:
      repo_url: string
      commit_sha: string
      branch: string?
    outputs:
      version: string
      released: bool

    steps:
      - name: run-checkout
        type: workflow
        outputs:
          - name: commit
        config:
          workflow: checkout
          version: 1

      - name: run-lint
        type: workflow
        outputs:
          - name: fmt_ok
          - name: clippy_ok
        config:
          workflow: lint
          version: 1

      - name: run-tests
        type: workflow
        outputs:
          - name: tests_ok
        config:
          workflow: test-unit
          version: 1

      - name: run-tag
        type: workflow
        when:
          field: .inputs.branch
          equals: mainline
        outputs:
          - name: version
          - name: tag_created
        config:
          workflow: tag
          version: 1

      - name: run-release
        type: workflow
        when:
          field: .outputs.tag_created
          equals: true
        outputs:
          - name: released
          - name: release_url
        config:
          workflow: release
          version: 1
